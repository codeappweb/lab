name: CI

# Production workflow gọn cho codeappweb/lab:
#   - Mistral (phiên đăng nhập) viết và xuất bản nội dung; writer commit bài
#     + derived + checkpoint trong MỘT commit trước khi mở PR.
#   - CI KHÔNG tự sinh văn bản, KHÔNG commit/push gì vào repo.
#   - Deploy: GitHub Pages build từ nhánh main (một đường deploy duy nhất).
#   - Regression tests engine chỉ chạy khi scripts/** hoặc workflow đổi —
#     áp cho cả PR và push main. Content-only PR chạy gate scoped.
#   - Full audit sâu chỉ chạy thủ công (workflow_dispatch), artifacts.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  light-qa:
    name: QA nhẹ (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Phạm vi thay đổi (engine hay content-only)
        id: scope
        run: |
          set -eu
          ENGINE=false
          CONTENT=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --quiet
            CHANGED=$(git diff --name-only origin/main...HEAD || true)
            if echo "$CHANGED" | grep -qE "^(scripts/|\.github/workflows/)"; then ENGINE=true; fi
            CONTENT=$(echo "$CHANGED" | grep -E "^(_posts/|danh-muc/|hub/).*\.md$" | paste -sd, - || true)
            ROOTMD=$(echo "$CHANGED" | grep -E "^[a-z0-9-]+\.md$" | paste -sd, - || true)
            if [ -n "$ROOTMD" ]; then CONTENT="${CONTENT:+$CONTENT,}$ROOTMD"; fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD^ HEAD || true)
            if echo "$CHANGED" | grep -qE "^(scripts/|\.github/workflows/)"; then ENGINE=true; fi
          else
            ENGINE=true
          fi
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"
          echo "scope: engine=$ENGINE content=[$CONTENT]"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check mọi script
        if: steps.scope.outputs.engine == 'true'
        run: |
          set -eu
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Regression tests (chỉ khi đổi engine/workflow — PR và push main)
        if: steps.scope.outputs.engine == 'true'
        run: node --test --test-reporter=spec scripts/*.test.mjs
      - name: Manifest + bài viết
        run: node scripts/validate-content.mjs
      - name: Chất lượng nội dung (front matter, trùng lặp, hỏng)
        run: node scripts/validate-content-quality.mjs
      - name: Trùng slug/topic (similarity chỉ là WARNING)
        run: node scripts/detect-duplicates.mjs
      - name: Link nội bộ (full khi đổi engine; scoped khi content-only)
        run: |
          set -eu
          if [ "${{ steps.scope.outputs.engine }}" = "true" ]; then
            node scripts/check-links.mjs
          elif [ -n "${{ steps.scope.outputs.content }}" ]; then
            node scripts/check-links.mjs --only "${{ steps.scope.outputs.content }}"
          else
            echo "Không có file md mới/sửa và không đổi engine — bỏ qua check-links."
          fi
      - name: Sitemap khớp bài viết
        # Push-driven pair: writer commit CHỈ chứa bài mới trong _posts/ — derived
        # state (manifest/sitemap) do production.yml sinh NGAY sau đó, và
        # publish-loop.mjs chạy validate-sitemap.mjs + sync-manifest --dry-run
        # (blocking) trên trạng thái cuối trước khi commit derived. Trên writer
        # commit, 2 gate này là false-negative cấu trúc → skip, không phải weaken.
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only --diff-filter=AM HEAD^ HEAD -- '_posts/*.md' | grep -q .; then
            echo "::notice::writer pair commit (posts chưa có derived) — gate sitemap sẽ chạy trong production.yml publish-loop trên trạng thái cuối."
          else
            node scripts/validate-sitemap.mjs
          fi
      - name: Manifest đồng bộ repo (dry-run, blocking)
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only --diff-filter=AM HEAD^ HEAD -- '_posts/*.md' | grep -q .; then
            echo "::notice::writer pair commit (posts chưa có derived) — gate manifest dry-run sẽ chạy trong production.yml publish-loop trên trạng thái cuối."
          else
            node scripts/sync-manifest.mjs --dry-run
          fi

  build:
    name: Jekyll build (blocking) + kiểm tra output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Cache dependencies (vendor/bundle)
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile') }}
          restore-keys: |
            bundle-${{ runner.os }}-
      - name: Bundle install
        run: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Jekyll build (strict front matter)
        run: bundle exec jekyll build --strict_front_matter
      - name: Kiểm tra _site (link + sitemap URL tồn tại)
        run: node scripts/validate-built.mjs

  full-audit:
    name: Full audit (chỉ thủ công, không chặn publish)
    if: github.event_name == 'workflow_dispatch'
    needs: [light-qa, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Legal freshness audit
        run: node scripts/legal-freshness-audit.mjs || echo "::warning::legal-freshness-audit trả về khác 0 — xem artifact để đánh giá"
      - name: Upload báo cáo audit (artifact, KHÔNG commit)
        uses: actions/upload-artifact@v4
        with:
          name: full-audit-report
          path: reports/
          if-no-files-found: ignore
