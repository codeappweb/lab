name: CI

# Hot path MÔNG cho codeappweb/lab:
#   - Chu ky production (publish(integrated) tren main) KHÔNG chay CI:
#     coordinator (production.yml) da chay 6 gate + Jekyll build blocking
#     truoc khi commit — khong duplicate build, khong Pages ci twice.
#   - CI chi chay khi: PR (bat ky) hoac push main doi engine/workflow
#     (scripts/**, .github/workflows/**, Gemfile, config, taxonomy, docs,
#     layouts/includes/assets) hoac workflow_dispatch (full audit thu cong).
#   - Regression tests chi chay khi engine doi; full audit chi khi dispatch.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'Gemfile'
      - '_config.yml'
      - 'package.json'
      - 'data/factory-config.json'
      - 'data/taxonomy.yml'
      - 'docs/**'
      - '_layouts/**'
      - '_includes/**'
      - 'assets/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  light-qa:
    name: QA nhẹ (blocking, engine-change)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Phạm vi thay đổi (engine hay content-only)
        id: scope
        run: |
          set -eu
          ENGINE=false
          CONTENT=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --quiet
            CHANGED=$(git diff --name-only origin/main...HEAD || true)
            if echo "$CHANGED" | grep -qE "^(scripts/|\.github/workflows/)"; then ENGINE=true; fi
            CONTENT=$(echo "$CHANGED" | grep -E "^(_posts/|danh-muc/|hub/).*\.md$" | paste -sd, - || true)
            ROOTMD=$(echo "$CHANGED" | grep -E "^[a-z0-9-]+\.md$" | paste -sd, - || true)
            if [ -n "$ROOTMD" ]; then CONTENT="${CONTENT:+$CONTENT,}$ROOTMD"; fi
          else
            ENGINE=true
          fi
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"
          echo "scope: engine=$ENGINE content=[$CONTENT]"
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Syntax check mọi script
        if: steps.scope.outputs.engine == 'true'
        run: |
          set -eu
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Regression tests (chỉ khi đổi engine/workflow)
        if: steps.scope.outputs.engine == 'true'
        run: node --test --test-reporter=spec scripts/*.test.mjs
      - name: Manifest + bài viết
        run: node scripts/validate-content.mjs
      - name: Chất lượng nội dung
        run: node scripts/validate-content-quality.mjs
      - name: Trùng slug/topic (similarity chỉ là WARNING)
        run: node scripts/detect-duplicates.mjs
      - name: Link nội bộ (full khi đổi engine; scoped khi content-only)
        run: |
          set -eu
          if [ "${{ steps.scope.outputs.engine }}" = "true" ]; then
            node scripts/check-links.mjs
          elif [ -n "${{ steps.scope.outputs.content }}" ]; then
            node scripts/check-links.mjs --only "${{ steps.scope.outputs.content }}"
          else
            echo "Không có file md mới/sửa và không đổi engine — bỏ qua check-links."
          fi
      - name: Sitemap khớp bài viết
        run: node scripts/validate-sitemap.mjs
      - name: Manifest đồng bộ repo (dry-run, blocking)
        run: node scripts/sync-manifest.mjs --dry-run

  build:
    name: Jekyll build (blocking) + kiểm tra output
    needs: light-qa
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Cache dependencies (vendor/bundle)
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile') }}
          restore-keys: |
            bundle-${{ runner.os }}-
      - name: Bundle install
        run: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Jekyll build (strict front matter)
        run: bundle exec jekyll build --strict_front_matter
      - name: Kiểm tra _site (link + sitemap URL tồn tại)
        run: node scripts/validate-built.mjs

  full-audit:
    name: Full audit (chỉ thủ công, không chặn publish)
    if: github.event_name == 'workflow_dispatch'
    needs: [light-qa, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Legal freshness audit
        run: node scripts/legal-freshness-audit.mjs || echo "::warning::legal-freshness-audit trả về khác 0 — xem artifact để đánh giá"
      - name: Upload báo cáo audit (artifact, KHÔNG commit)
        uses: actions/upload-artifact@v7
        with:
          name: full-audit-report
          path: reports/
          if-no-files-found: ignore
