name: Content Factory Scheduled

# ======================================================================
# NO-AI-API CONTENT FACTORY (modeled on thuexemayhanoi/shop)
# ----------------------------------------------------------------------
# GitHub Actions = deterministic hands ONLY. The authenticated
# Mistral/Vibe agent session (or a human) = editorial writer. This
# workflow NEVER calls an AI API, NEVER writes article prose and NEVER
# invents facts. It only:
#   - validates configuration, queue matrix and transaction state
#   - claims the next batch of eligible PENDING (status "planned")
#     rows from data/article-manifest.jsonl — HARD CAP 20 rows
#   - exports writer manifests/instructions (topics only, no prose)
#   - runs deterministic QA on drafts the writer already produced
#   - publishes ONLY a 100% ready batch (assert-ready + all-or-nothing
#     publish: any FAIL row => ZERO articles published)
#   - promotes PASS drafts to _posts, regenerates canonical artifacts
#     — never overwriting anything
#
# SECRETS: none. Only the default GITHUB_TOKEN (checkout/commit/push).
# No MISTRAL/OPENAI/GEMINI/ANTHROPIC keys, no external LLM HTTP API,
# no paid generation API. Article prose requires the authenticated
# writer session; GitHub cron performs prepare-next, validation,
# state maintenance, QA of existing drafts, publishing of PASS
# content and reports/progress only.
#
# ONE-TIME PRODUCTION TEST: 2026-09-27 19:00 Asia/Ho_Chi_Minh
# (= 12:00 UTC, cron "0 12 27 9 *"). GitHub cron has no year field,
# so the gate job enforces an exact runtime guard: the scheduled
# production batch may only run when the UTC date is exactly
# 2026-09-27; in any other year the same cron exits successfully
# without processing a batch. workflow_dispatch stays available for
# manual testing later.
#
# GATE SEMANTICS (production-safety hardening):
#   - Jekyll build is a BLOCKING gate: bundle install + bundle exec
#     jekyll build, no error swallowing. A failed build fails the
#     workflow BEFORE commit/push.
#   - self-heal-audit.mjs and legal-freshness-audit.mjs are BLOCKING
#     (same semantics as content-pipeline.yml: validation failure = no
#     commit). Legal validation of legal-sensitive articles stays
#     blocking per data/legal-sources.yml rules.
#   - publish is gated by `assert-ready --expected-size 20` (exactly
#     20 rows, all PASS, all drafts present, zero claimed/fail/review)
#     AND the controller-side all-or-nothing publish gate. 19 PASS +
#     1 FAIL => publish ZERO articles; the failed run makes NO repository
#     writes and leaves a diagnostics artifact only (see failure path below).
#   - commit/push is delegated to scripts/factory-push.mjs
#     (audit fix 2026-09-29): staged scope verified against a
#     deterministic-output allowlist, push is fail-closed, and after a
#     rebase the full revalidation commands RERUN on the rebased tree
#     before pushing again — so the pushed tree is always validated.
#   - publish is two-phase: `publish` stages rows and moves drafts to
#     _posts; after the push is confirmed on origin/main,
#     `finalize-publish --commit <sha>` flips staged rows to published
#     and persists state/history/progress. A push failure leaves the run
#     red with ZERO repository writes from the failed checkout; the next
#     run recovers the transaction idempotently via recover, refusing to
#     touch anything already committed on origin/main.
# ======================================================================

on:
  schedule:
    - cron: "0 12 27 9 *" # 19:00 Asia/Ho_Chi_Minh == 12:00 UTC
  workflow_dispatch:
    inputs:
      op:
        description: "Deterministic operator command"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - prepare-next
          - qa
          - publish
          - consistency
          - recover
          - requeue
      batch_size:
        description: "Max rows per batch (hard limit 20)"
        required: false
        default: "20"
      ids:
        description: "Comma-separated row ids (requeue only)"

        required: false
        default: ""

permissions:
  contents: write

# Issue #5: ALL workflows that write to origin/main share ONE repo-wide
# concurrency group ("main-writer", also used by content-pipeline.yml and the
# reconcile job of validate.yml) so main writers are SERIALIZED — queued,
# never cancelled mid-run (a publish transaction is never aborted by another
# queued run). This is the real coordination between independent runners.
# The data/factory-lock.json file lock is advisory bookkeeping within a
# shared checkout, NOT a distributed lock.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      op: ${{ steps.gate.outputs.op }}
    steps:
      - name: One-time runtime date guard (scheduled runs only)
        id: gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY="$(date -u +%F)"
            echo "UTC date: $TODAY (one-time production window: 2026-09-27)"
            if [ "$TODAY" = "2026-09-27" ]; then
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "op=production" >> "$GITHUB_OUTPUT"
            else
              # Exit successfully WITHOUT processing a batch. The
              # 2026-09-27 window is closed (or not reached); this same
              # Sept-27 cron can never process a production batch again.
              echo "One-time production test window (2026-09-27) not active. Exiting successfully without processing a batch."
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "op=none" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "op=${{ github.event.inputs.op }}" >> "$GITHUB_OUTPUT"
          fi

  factory:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    env:
      OP: ${{ needs.gate.outputs.op }}
      IDS: ${{ github.event.inputs.ids }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
      # Issue #5: every run gets its OWN stable run id (identical for every
      # step of the same run) so the factory lock can actually distinguish
      # workers — never the shared default "manual".
      FACTORY_RUN_ID: "factory-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Ruby (Jekyll blocking build)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Read and validate operator command (whitelist)
        run: |
          set -eu
          case "$OP" in
            production|prepare-next|qa|publish|consistency|recover|requeue) ;;
            *) echo "::error::unsupported op: $OP"; exit 1 ;;
          esac
          echo "operator op: $OP"

      - name: Enforce hard batch cap (20 rows maximum)
        run: |
          set -eu
          n="${BATCH_SIZE:-20}"
          case "$n" in (*[!0-9]*|"") n=20 ;; esac
          if [ "$n" -gt 20 ]; then
            echo "::error::batch_size $n exceeds the hard test limit of 20"
            exit 1
          fi
          echo "batch size: $n (hard cap 20)"

      - name: Validate factory configuration
        run: node scripts/factory-batch.mjs check-config

      - name: Validate content matrix (queue + duplicate detection)
        run: |
          set -eu
          node scripts/detect-duplicates.mjs
          node scripts/validate-content-quality.mjs

      - name: Recover stale/pending transaction state
        run: node scripts/factory-batch.mjs recover

      - name: Run consistency checks
        run: node scripts/factory-batch.mjs consistency

      - name: prepare-next — claim next 20 eligible PENDING rows, export writer manifests
        if: env.OP == 'production' || env.OP == 'prepare-next'
        run: node scripts/factory-batch.mjs prepare-next --batch-size "$BATCH_SIZE"

      # Standalone op=qa records findings (exit 3 tolerated) without
      # publishing anything. Production publish is separately blocked
      # by assert-ready + the all-or-nothing publish gate below.
      - name: qa — deterministic QA of writer-produced drafts (if present)
        if: env.OP == 'production' || env.OP == 'qa'
        run: |
          code=0
          node scripts/factory-batch.mjs qa || code=$?
          echo "qa exit code: $code (3 = FAIL rows recorded in state; publish stays blocked)"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          exit 0

      # BLOCKING production gate: exactly 20 rows, all PASS, all drafts
      # on disk, zero claimed/fail/review. 19 PASS + 1 FAIL => the step
      # fails and ZERO articles are published.
      - name: assert-ready — 100% batch readiness gate (BLOCKING)
        if: env.OP == 'production' || env.OP == 'publish'
        run: node scripts/factory-batch.mjs assert-ready --expected-size 20

      - name: publish — all-or-nothing, PASS-only, never overwrite (BLOCKING)
        if: env.OP == 'production' || env.OP == 'publish'
        run: node scripts/factory-batch.mjs publish

      # Canonical artifact rebuild. self-heal-audit and
      # legal-freshness-audit are BLOCKING gates, identical to
      # content-pipeline.yml ("validation failure = no commit").
      # Legal validation for legal-sensitive articles remains blocking
      # per data/legal-sources.yml.
      - name: Rebuild category/index/sitemap artifacts (canonical scripts, BLOCKING)
        if: env.OP == 'production' || env.OP == 'publish'
        run: |
          set -eu
          node scripts/gen-sitemap-shards.mjs
          node scripts/validate-sitemap.mjs
          # Issue #6: --require-committed — staged posts that are only in this
          # working tree (publish phase 1, not pushed yet) must NOT flip
          # manifest rows to published. Only origin/main-verified posts do.
          node scripts/sync-manifest.mjs --require-committed
          node scripts/gen-topic-queue.mjs
          node scripts/seo-score.mjs
          node scripts/compute-content-hashes.mjs
          node scripts/gen-dashboard.mjs
          node scripts/self-heal-audit.mjs
          node scripts/legal-freshness-audit.mjs

      - name: requeue — eligible FAIL/REVIEW rows only (stale-safe)
        if: env.OP == 'requeue'
        run: |
          set -eu
          if [ -z "$IDS" ]; then echo "::error::requeue requires ids"; exit 1; fi
          code=0
          node scripts/factory-batch.mjs requeue --ids "$IDS" || code=$?
          echo "requeue exit code: $code (4 = refusals recorded, not fatal)"
          if [ "$code" -ne 0 ] && [ "$code" -ne 4 ]; then exit "$code"; fi

          exit 0

      - name: Full test suite (all deploy gates, BLOCKING)
        run: |
          set -eu
          node scripts/validate-deploy.mjs
          node scripts/check-links.mjs

      # BLOCKING production build using the repository Gemfile
      # (github-pages). No || true, no error swallowing: a failed
      # build fails the workflow BEFORE commit/push.
      - name: Jekyll production build (BLOCKING gate)
        run: |
          set -eu
          bundle exec jekyll build

      - name: Validate built site (BLOCKING gate)
        run: node scripts/validate-built.mjs

      - name: Save progress
        run: node scripts/factory-batch.mjs progress

      # Commit and push deterministic outputs via the SHARED scope-
      # verified, fail-closed pusher (scripts/factory-push.mjs):
      #   - only allowlisted deterministic-output paths can be staged
      #   - push is retried with fetch + rebase, and after every rebase
      #     the full revalidation below RERUNS on the rebased tree
      #   - the workflow fails if origin/main was never reached
      - name: Commit and push deterministic outputs (scope-verified, fail-closed)
        run: |
          set -eu
          git config user.name "content-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/factory-push.mjs \
            --message "content-factory: ${OP} (deterministic outputs of canonical tooling only; article prose written by the authenticated Vibe writer session)" \
            --revalidate "node scripts/detect-duplicates.mjs && node scripts/validate-content-quality.mjs && node scripts/check-links.mjs && node scripts/validate-sitemap.mjs && node scripts/self-heal-audit.mjs && node scripts/legal-freshness-audit.mjs && bundle exec jekyll build && node scripts/validate-built.mjs"

      # Two-phase publish completion: the articles are on origin/main.
      # finalize-publish verifies the commit exists on origin/main, then
      # flips staged rows to published and records factory-history.
      # The follow-up state/history/progress commit goes through the same
      # scope-verified, fail-closed pusher. If this step is interrupted,
      # `factory-batch.mjs recover` completes it idempotently on the next
      # run (staged + committed on origin/main => finalize with the
      # discovered sha).
      - name: finalize-publish — confirm publish on origin/main, persist state (BLOCKING)
        if: env.OP == 'production' || env.OP == 'publish'
        run: |
          set -eu
          SHA="$(git rev-parse HEAD)"
          git fetch origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::publish commit $SHA is not present on origin/main — refusing to finalize (state remains staged; recover will retry)"
            exit 1
          fi
          node scripts/factory-batch.mjs finalize-publish --commit "$SHA"
          node scripts/factory-batch.mjs progress
          # The publish commit is verified on origin/main above, so the
          # manifest rows may now flip to published (still origin/main-
          # verified) and the follow-up commit proves convergence.
          node scripts/sync-manifest.mjs --require-committed
          node scripts/factory-batch.mjs progress
          node scripts/factory-push.mjs \
            --message "content-factory: finalize-publish ${OP} (${SHA:0:10}) — state/history/progress/manifest only, articles already on origin/main" \
            --revalidate "node scripts/factory-batch.mjs consistency && node scripts/sync-manifest.mjs --require-committed --dry-run && node scripts/validate-sitemap.mjs"

      # Failure path (issue #3): a failed production/publish run makes NO
      # repository writes from the failed checkout — no rollback step, no
      # diagnostics commit, no push. Every failure-path step is upload-only
      # (Actions artifact). The run stays red and the two-phase transaction
      # stays staged; the NEXT run recovers it idempotently (recover fetches
      # the remote first and never touches anything already on origin/main).

      # Diagnostics are ALSO uploaded as an Actions artifact (issue #3): a
      # failed run leaves inspectable evidence even when nothing can be
      # pushed. Only factory state/report files are included — no logs.
      - name: Upload failure diagnostics (artifact)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: factory-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/factory/
            data/factory-state.json
            data/factory-history.json
            data/factory-lock.json
          if-no-files-found: ignore
          retention-days: 30
