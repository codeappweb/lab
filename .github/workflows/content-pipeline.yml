name: Content Pipeline (validate + audit)

# Advisory pipeline: production deployment happens via GitHub Pages branch build.
# This workflow validates, audits, regenerates deterministic artifacts (sitemaps,
# dashboards, manifest sync) and commits them back if — and only if — validation
# is green.
#
# Audit fixes 2026-09-29:
#   - Jekyll build is a BLOCKING gate: bundle install + bundle exec jekyll
#     build + validate-built, no `|| true`, no error swallowing. A failed
#     build fails the workflow BEFORE any commit/push.
#   - Commit/push uses scripts/factory-push.mjs (scope-verified, fail-closed,
#     rebase + revalidation on the exact tree that will be pushed), shared
#     with the content-factory workflow.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Issue #5: shared repo-wide writer group (see content-factory-scheduled.yml) —
# every workflow that pushes to origin/main is serialized; queued, never
# cancelled mid-run.
concurrency:
  group: main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Validate content quality
        run: node scripts/validate-content-quality.mjs

      - name: Detect duplicates
        run: node scripts/detect-duplicates.mjs

      - name: Check internal links (disk truth)
        run: node scripts/check-links.mjs

      - name: Regenerate sitemap shards
        run: node scripts/gen-sitemap-shards.mjs

      - name: Validate sitemap
        run: node scripts/validate-sitemap.mjs

      - name: Self-heal audit
        run: node scripts/self-heal-audit.mjs

      - name: Legal freshness audit
        run: node scripts/legal-freshness-audit.mjs

      - name: SEO scoring
        run: node scripts/seo-score.mjs

      - name: Content hashes
        run: node scripts/compute-content-hashes.mjs

      - name: Sync manifest and progress
        run: node scripts/sync-manifest.mjs

      - name: Topic queue view
        run: node scripts/gen-topic-queue.mjs

      - name: Dashboard
        run: node scripts/gen-dashboard.mjs

      # BLOCKING production build: no || true, no error swallowing. The
      # build runs AFTER the artifact regeneration above so it validates the
      # exact tree that would be pushed.
      - name: Jekyll build (BLOCKING gate)
        run: |
          set -eu
          bundle install --jobs 4 --retry 3
          bundle exec jekyll build

      - name: Validate built site (BLOCKING gate)
        run: node scripts/validate-built.mjs

      # Commit regenerated artifacts via the shared scope-verified,
      # fail-closed pusher. If origin/main moved, factory-push rebases and
      # RERUNS this revalidation on the rebased tree before pushing.
      - name: Commit regenerated artifacts if changed (scope-verified, fail-closed)
        run: |
          set -eu
          git config user.name "lab-pipeline-bot"
          git config user.email "actions@github.com"
          node scripts/factory-push.mjs \
            --message "chore(pipeline): regenerate sitemaps, audits, dashboard" \
            --revalidate "node scripts/validate-content-quality.mjs && node scripts/detect-duplicates.mjs && node scripts/check-links.mjs && node scripts/validate-sitemap.mjs && bundle exec jekyll build && node scripts/validate-built.mjs"
