name: Content Pipeline (audit + regen + verified deploy)

# Advisory audit + deterministic regeneration + verified branch deployment.
# Pages builds from the branch; GITHUB_TOKEN pushes do NOT trigger branch
# builds, so after committing regenerated artifacts we explicitly request a
# Pages build via the API and verify the deployed revision.
# This pipeline NEVER writes articles. The dispatch-only writer-preflight job
# at the end only checks configuration and provider capability; the actual
# writer is a local Mistral/Vibe session (see docs/ENGINE-RUNBOOK.md).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: production-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  audit-regen-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gates first (nonzero exit = job fails, nothing is deployed)
        run: |
          node scripts/validate-content-quality.mjs
          node scripts/detect-duplicates.mjs
          node scripts/check-links.mjs
          node scripts/self-heal-audit.mjs
          node scripts/legal-freshness-audit.mjs --gate
          node scripts/sync-manifest.mjs

      - name: Regenerate deterministic artifacts
        run: |
          node scripts/gen-site-data.mjs
          node scripts/gen-archive-pages.mjs
          node scripts/gen-sitemap-shards.mjs
          node scripts/validate-sitemap.mjs
          node scripts/seo-score.mjs
          node scripts/compute-content-hashes.mjs
          node scripts/gen-topic-queue.mjs
          node scripts/gen-dashboard.mjs
          node scripts/measure-output.mjs

      # Real Jekyll build + rendered-output validation BEFORE any deployment.
      # A failed build or a rendered-link/sitemap error fails this job and
      # prevents the Pages build request below. The deploy step depends on
      # this — branch-based Pages deployment does NOT inherit the separate
      # pull_request validation workflow, so the gates must run here too.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build site (must succeed; no || true)
        run: |
          bundle install --jobs 4
          bundle exec jekyll build
      - name: Validate rendered output (links + sitemap membership)
        run: node scripts/validate-built.mjs --site _site
      # Navigation consistency on the rendered surfaces (identical labels per
      # URL, every nav URL resolves in the build).
      - name: Navigation consistency (rendered surfaces)
        run: node scripts/validate-navigation.mjs --site _site
      # Re-run self-heal audit against the rendered corpus: orphan warnings
      # are verified against rendered links, not source-only estimates.
      - name: Self-heal audit (rendered corpus)
        run: node scripts/self-heal-audit.mjs

      - name: Commit regenerated artifacts if changed
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore: regenerate sitemap shards, site data, reports [skip ci]"
            git push
          fi

      - name: Request Pages build (token pushes do not trigger branch builds)
        run: gh api --method POST /repos/codeappweb/lab/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify deployed revision and representative URLs
        run: node scripts/verify-deployment.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: reports/
          if-no-files-found: warn

  # Writer preflight: dispatch-only, checks config + provider capability.
  # This job does NOT write articles and cannot enable generation by itself;
  # data/engine-config.json must also explicitly enable it (it is false by
  # default). Real writing happens in a local Mistral/Vibe session.
  writer-preflight:
    name: Writer preflight (dispatch-only; writes no articles)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: audit-regen-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preflight writer provider (config + capability only)
        run: |
          node scripts/engine/runner.mjs status
          node scripts/engine/runner.mjs preflight
          # Double gate: workflow_dispatch is NOT enough; the durable config
          # must also explicitly enable generation. It is false by default.
          node -e "const c=require('./data/engine-config.json'); if(!c.generation_enabled){console.error('generation_enabled=false — unattended generation stays disabled'); process.exit(1);}"
