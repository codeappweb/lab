name: Diag tests (TEMP, branch only)

on:
  push:
    branches: [engine/content-index]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: engine/content-index
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run regression tests, capture output
        run: |
          set +e
          mkdir -p diagnostics
          node --test --test-reporter=spec scripts/*.test.mjs > diagnostics/test-report.txt 2>&1
          echo "EXIT=$?" >> diagnostics/test-report.txt
          exit 0
      - name: Commit report to branch
        run: |
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          git add diagnostics/test-report.txt
          git commit -m "diag(tests): capture regression test output (TEMP)"
          git push origin HEAD:engine/content-index
