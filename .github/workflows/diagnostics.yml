name: Diagnostics (coordinator repro, TEMP)

on:
  push:
    branches: [main]
    paths: ['diagnostics/**']

permissions:
  contents: write

concurrency:
  group: diagnostics
  cancel-in-progress: false

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Fetch staging branches
        run: git fetch origin '+refs/heads/staging/*:refs/remotes/origin/staging/*' --quiet
      - name: Repro collect + guard (capture exits)
        run: |
          set +e
          R=diagnostics/report.md
          mkdir -p diagnostics
          {
            echo "# Coordinator repro report (lan 5 — sau fail run 37018813624)"
            date -u
            echo "## sha"
            git rev-parse HEAD
            echo "## step sync-manifest dry-run"
            node scripts/sync-manifest.mjs --dry-run
            echo "EXIT_SYNC=$?"
            echo "## step cycle-phase resume"
            node scripts/cycle-phase.mjs --resume
            echo "EXIT_RESUME=$?"
            echo "## step collect-staging (khong wait)"
            node scripts/collect-staging.mjs
            echo "EXIT_COLLECT=$?"
            echo "## scope.json"
            cat /tmp/scope.json
            echo "## step integrate-guard"
            node scripts/integrate-guard.mjs
            echo "EXIT_GUARD=$?"
            echo "## git show file front matter tu staging"
            git show origin/staging/writer-1:_posts/2026-10-02-chu-ky-sac-xa-la-gi-hieu-tuoi-tho-pin-xe-dien.md | head -50
            echo "## git diff three-dot writer-1"
            git diff --name-only origin/main...origin/staging/writer-1
          } > "$R" 2>&1
          cat "$R"
      - name: Commit report
        run: |
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          git add diagnostics/report.md
          git commit -m "diag(report): repro collect + guard sau fail run 37018813624"
          git push origin HEAD:main
