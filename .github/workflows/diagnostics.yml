name: Diagnostics (dump C12 conventions, TEMP)

on:
  push:
    branches: [main]
    paths: ['diagnostics/**']

permissions:
  contents: write

concurrency:
  group: diagnostics
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Dump C12 conventions
        run: |
          set -eu
          node -e '
            const fs = require("fs");
            const rows = fs.readFileSync("data/article-manifest.jsonl", "utf8").split("\n").filter(Boolean).map(l => JSON.parse(l));
            const c12 = rows.filter(r => String(r.id).startsWith("C12"));
            const out = { c12Rows: c12 };
            const pub = c12.filter(r => r.status === "published");
            if (pub.length) {
              const slug = pub[0].slug;
              out.sampleSlug = slug;
              const files = fs.readdirSync("_posts").filter(f => f.includes(slug));
              out.sampleFile = files[0] || null;
              if (files[0]) out.sampleFrontMatter = fs.readFileSync("_posts/" + files[0], "utf8").split("---")[1];
            }
            fs.writeFileSync("diagnostics/c12-conventions.json", JSON.stringify(out, null, 2) + "\n");
          '
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          git add diagnostics/c12-conventions.json
          git commit -m "diag(dump): C12 conventions cho writer session"
          git push origin HEAD:main
