name: Diagnostics (allocate cycle, TEMP)

# TEMPORARY: chay next-pair.mjs --allocate (real allocation, deterministic
# tu manifest tren main) va dump 6 row duoc phan cong ra
# diagnostics/allocate-rows.json de writer session doc. Commit
# data/factory-cycle.json theo dung message quy uac cycle(allocate).

on:
  push:
    branches: [main]
    paths: ['diagnostics/**']

permissions:
  contents: write

concurrency:
  group: diagnostics
  cancel-in-progress: false

jobs:
  allocate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Allocate cycle va dump assigned rows
        run: |
          set -eu
          node scripts/next-pair.mjs --allocate | tee /tmp/alloc.log
          node -e '
            const fs = require("fs");
            const rows = fs.readFileSync("data/article-manifest.jsonl", "utf8").split("\n").filter(Boolean).map(l => JSON.parse(l));
            const cyc = JSON.parse(fs.readFileSync("data/factory-cycle.json", "utf8"));
            const ids = Object.values(cyc.assignments).flat();
            const picked = rows.filter(r => ids.includes(String(r.id)));
            fs.writeFileSync("diagnostics/allocate-rows.json", JSON.stringify({ cycle: cyc, rows: picked }, null, 2) + "\n");
          '
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          CYC=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/factory-cycle.json","utf8")).cycle_id)')
          git add data/factory-cycle.json diagnostics/allocate-rows.json
          git commit -m "cycle(allocate): $CYC"
          git push origin HEAD:main
