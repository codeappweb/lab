name: Diagnostics (coordinator repro, TEMP)

on:
  push:
    branches: [main]
    paths: ['diagnostics/**']

permissions:
  contents: write

concurrency:
  group: diagnostics
  cancel-in-progress: false

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Fetch staging branches
        run: git fetch origin '+refs/heads/staging/*:refs/remotes/origin/staging/*' --quiet
      - name: Repro publish transaction (per-step exits, report .txt)
        run: |
          set +e
          R=diagnostics/report.txt
          mkdir -p diagnostics
          {
            echo "# Coordinator repro report"
            date -u
            echo "## sha"
            git rev-parse HEAD
            echo "## step sync-manifest dry-run"
            node scripts/sync-manifest.mjs --dry-run
            echo "EXIT_SYNC=$?"
            echo "## step cycle-phase check-stop"
            node scripts/cycle-phase.mjs --check-stop
            echo "EXIT_CHECKSTOP=$?"
            echo "## step collect-staging (khong wait)"
            node scripts/collect-staging.mjs
            echo "EXIT_COLLECT=$?"
            echo "## scope.json"
            cat /tmp/scope.json
            echo "## step integrate-guard"
            node scripts/integrate-guard.mjs
            echo "EXIT_GUARD=$?"
            echo "## step cycle-phase integrating (retry failed cycle)"
            node scripts/cycle-phase.mjs integrating
            echo "EXIT_PHASE=$?"
            echo "## step apply-staging"
            node scripts/apply-staging.mjs
            echo "EXIT_APPLY=$?"
            echo "## publish-loop integrate DRY-RUN (production args, sau apply, gates only)"
            node scripts/publish-loop.mjs --integrate --added "_posts/2026-10-02-chu-ky-sac-xa-la-gi-hieu-tuoi-tho-pin-xe-dien.md" --repaired "" --dry-run
            echo "EXIT_PL_DRY=$?"
            echo "## git status sau publish-loop dry"
            git status --porcelain
            echo "## git status sau apply"
            git status --porcelain
            echo "## gate 1 gen-sitemap-shards"
          
  node scripts/gen-sitemap-shards.mjs
            echo "EXIT_G1=$?"
            echo "## gate 2 sync-manifest (derive)"
            node scripts/sync-manifest.mjs
            echo "EXIT_G2=$?"
            echo "## gate 3 validate-content"
            node scripts/validate-content.mjs
            echo "EXIT_G3=$?"
            echo "## gate 4 validate-content-quality"
            node scripts/validate-content-quality.mjs
            echo "EXIT_G4=$?"
            echo "## gate 5 detect-duplicates"
            node scripts/detect-duplicates.mjs
            echo "EXIT_G5=$?"
            echo "## gate 6 check-links"
            node scripts/check-links.mjs
            echo "EXIT_G6=$?"
            echo "## gate 7 validate-sitemap"
            node scripts/validate-sitemap.mjs
            echo "EXIT_G7=$?"
            echo "## gate 8 sync-manifest dry-run (in-sync proof)"
            node scripts/sync-manifest.mjs --dry-run
            echo "EXIT_G8=$?"
            echo "## jekyll build (strict)"
            echo "## bundle install"
            bundle config set path vendor/bundle
            bundle install --jobs 4 --retry 3
            echo "EXIT_BUNDLE=$?"
            echo "## jekyll build (strict, lan 2 sau bundle)"
            bundle exec jekyll build --strict_front_matter
            echo "EXIT_BUILD=$?"
            echo "## validate-built"
            node scripts/validate-built.mjs
            echo "EXIT_VALIDATE_BUILT=$?"
            echo "## ket thuc repro"
          } > "$R" 2>&1
          cat "$R"
      - name: Commit report (chỉ report.txt — KHÔNG bao gio commit index cua apply-staging)
        run: |
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          # apply-staging da stage bai vao index (git checkout sha -- file) — unstage TAT CA
          # truoc khi add report, neu khong commit se danh bai chua xuat ban len main (bug 70bfc443).
          git reset --quiet
          git add diagnosti
cs/report.txt
          git commit -m "diag(report): repro publish transaction (per-step exit codes)"
          git push origin HEAD:main
