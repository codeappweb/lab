name: Diagnostics (coordinator repro, TEMP)

on:
  push:
    branches: [main]
    paths: ['diagnostics/**']

permissions:
  contents: write

concurrency:
  group: diagnostics
  cancel-in-progress: false

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Fetch staging branches
        run: git fetch origin '+refs/heads/staging/*:refs/remotes/origin/staging/*' --quiet
      - name: Repro FULL publish transaction (per-step exits)
        run: |
          set +e
          R=diagnostics/report.md
          mkdir -p diagnostics
          {
            echo "# Coordinator repro report (lan 6 — full publish transaction sau fail runs 37018813624 + 37018879948)"
            date -u
            echo "## sha"
            git rev-parse HEAD
            echo "## step collect-staging (khong wait)"
            node scripts/collect-staging.mjs
            echo "EXIT_COLLECT=$?"
            echo "## step integrate-guard"
            node scripts/integrate-guard.mjs
            echo "EXIT_GUARD=$?"
            echo "## scope.json"
            cat /tmp/scope.json
            echo "## step apply-staging"
            node scripts/apply-staging.mjs
            echo "EXIT_APPLY=$?"
            echo "## git status sau apply"
            git status --porcelain
            echo "## gate 1 gen-sitemap-shards"
            node scripts/gen-sitemap-shards.mjs
            echo "EXIT_G1=$?"
            echo "## gate 2 sync-manifest (derive)"
            node scripts/sync-manifest.mjs
            echo "EXIT_G2=$?"
            echo "## manifest row moi (C12-0002)"
            grep -n 'C12-0002' data/article-manifest.jsonl || echo "khong thay C12-0002 trong manifest"
            echo "## gate 3 validate-content"
            node scripts/validate-content.mjs
            echo "EXIT_G3=$?"
            echo "## gate 4 validate-content-quality"
            node scripts/validate-content-quality.mjs
            echo "EXIT_G4=$?"
            echo "## gate 5 detect-duplicates"
            node scripts/detect-duplicates.mjs
            echo "EXIT_G5=$?"
            echo "## gate 6 check-links"
            node scripts/check-links.mjs
            echo "EXIT_G6=$?"
            echo "## gate 7 validate-sitemap"
            node scripts/validate-sitemap.mjs
            echo "EXIT_G7=$?"
            echo "## gate 8 sync-manifest dry-run (in-sync proof)"
            node scripts/sync-manifest.mjs --dry-run
            echo "EXIT_G8=$?"
            echo "## bundle install"
            bundle config set path vendor/bundle
            bundle install --jobs 4 --retry 3
            echo "EXIT_BUNDLE=$?"
            echo "## jekyll build (strict)"
            bundle exec jekyll build --strict_front_matter --disable-disk-cache
            echo "EXIT_BUILD=$?"
            echo "## validate-built"
            node scripts/validate-built.mjs
            echo "EXIT_VALIDATE_BUILT=$?"
            echo "## ket thuc repro"
          } > "$R" 2>&1
          cat "$R"
      - name: Commit report
        run: |
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          git add diagnostics/report.md
          git commit -m "diag(report): lan 6 — full publish transaction repro voi per-step exit codes"
          git push origin HEAD:main
