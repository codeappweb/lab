name: Production (coordinator)

# 3-WRITER STAGED COORDINATOR cho codeappweb/lab (deterministic, KHONG AI,
# KHONG cron):
#   WRITERS (writer-1/2/3): chay `next-pair.mjs --allocate` (MOT lan dau chu
#           ky, tao data/factory-cycle.json: cycle_id + base_sha + assignment
#           plan bat bien, MÔT commit tren main) roi `next-pair.mjs --writer
#           writer-K` — doc dung plan cua cycle, KHONG tu derive tu HEAD moi.
#           Writer chi viet _posts/*.md kem factory metadata, push len nhanh
#           rieng staging/writer-K. KHONG push main, KHONG cham state chia se.
#   SIGNAL (staging-signal.yml, NHE): push _posts/** len staging/writer-* chi
#           tao run marker. production.yml trigger `workflow_run` tren run do
#           — theo GitHub, workflow_run LUON chay tren default branch (MAIN):
#           coordinator khong bao gio ke thua ref staging/writer-*, khong can
#           dispatch API/token, khong race auth.
#   COORDINATOR (workflow nay, MAIN context, singleton queue toan cuc,
#           crash-safe): RECONCILE (self-heal manifest/progress/sitemap truoc
#           moi allocation/noop) -> --check-stop (2 run fail lien tiep -> DUNG
#           production) -> resume cycle dang mo neu co (cycle-phase --resume)
#           -> cho DU output cac writer theo cycle plan (collect-staging
#              --wait-for, timeout writer_wait_timeout_minutes; timeout ->
#              tiep tuc voi writer da kip push, phan con lai RETRY chu ky sau)
#           -> snapshot 3 nhanh staging (collect-staging, read-only,
#              contamination guard, staging-age telemetry)
#           -> integrate-guard (tu choi file ngoai _posts, vuot writer_chunk_
#              size, vuot integration cap, trung slug, trung manifest_id,
#              reassign slug da published; sai cycle/base_sha/slice -> REVIEW
#              chu khong publish; bai da integrate giong het -> skip idempotent)
#           -> apply -> derive + 6 gate nhe + Jekyll build BLOCKING
#              (build_fail_seconds = HARD FAIL) + validate-built
#           -> MÔT commit publish tren main (posts + derived allowlist +
#              telemetry + cycle state + checkpoint + failure ledger reset)
#           -> MÔT Pages deployment: upload _site DA validate lam artifact
#              duy nhat roi deploy-pages (actions/configure-pages +
#              upload-pages-artifact + deploy-pages; KHONG rebuild, KHONG
#              dua vao Pages trigger tu dong tu push main)
#           -> verify URL live that
#           -> finalize cycle (phase complete + deployment id + live_verified,
#              MÔT commit bookkeeping nho)
#           -> reset staging bang force-with-lease voi sha DA snapshot.
#   Moi chu ky = MÔT commit xuat ban = MÔT Pages deployment = MÔT checkpoint.
#   KHONG force-push main. Reset staging chi tac dong nhanh rieng; lease giu
#   sha da snapshot nen khong bao gio de len push moi cua writer.
#   MAIN CONTEXT + `environment: github-pages` (url = deployment): run luon
#   co ref main nen branch protection cua environment github-pages cho phep;
#   staging/writer-* KHONG BAO GIO chay deploy-pages.
#   YEU CAU (mot lan, thu cong): Settings -> Pages -> Build and deployment ->
#   Source = GitHub Actions.
#   YAML QUY DINH: gia tri scalar KHONG quoted KHONG duoc chua ": " — lam
#   workflow invalid (moi trigger thanh run 0-job fail).

on:
  # Signal: run cua staging-signal.yml hoan tat (writer push _posts) →
  # coordinator chay tren MAIN (workflow_run luon dung default branch).
  workflow_run:
    workflows: ['Staging signal (writer output marker)']
    types: [completed]
    branches: ['staging/writer-1', 'staging/writer-2', 'staging/writer-3']
  # Token push trigger: push thay doi data/.coordinator-trigger len main
  # de chay coordinator NGAY (self-heal derived state + integrate staging) —
  # khong can dispatch API, khong noi dung dac biet trong file.
  push:
    branches: [main]
    paths: ['data/.coordinator-trigger']
  # Manual: run thuong + maintenance dispatch (chon branch main).
  workflow_dispatch:
    inputs:
      maintenance:
        description: 'Maintenance: dong bo derived state (manifest + progress + sitemap), KHONG publish bai moi, KHONG deploy Pages'
        type: boolean
        default: false

concurrency:
  group: production-coordinator
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  integrate:
    name: Collect -> guard -> QA -> one commit -> one Pages deploy
    if: ${{ inputs.maintenance != true && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # MAIN CONTEXT (workflow_run = default branch; workflow_dispatch ref=main):
    # environment github-pages chi cho phep main — dung cho deploy cuoi cung.
    # Staging/writer-* khong bao gio vao job nay.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch staging branches
        run: git fetch origin '+refs/heads/staging/*:refs/remotes/origin/staging/*' --quiet
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # ---- 0. safety stop + crash recovery ---------------------------------
      # ---- 0b. reconcile derived state (self-heal, TRUOC moi allocation/noop) ----
      - name: Reconcile derived state (self-heal manifest progress sitemap)
        run: |
          set -eu
          if node scripts/sync-manifest.mjs --dry-run; then
            echo "reconcile: derived state in sync."
            exit 0
          fi
          echo "::warning::MANIFEST/PROGRESS DRIFT phat hien — tu dong dong bo derived state (allowlist only, fail-closed)."
          node scripts/sync-manifest.mjs
          node scripts/gen-sitemap-shards.mjs
          node scripts/validate-content.mjs
          node scripts/validate-content-quality.mjs
          node scripts/detect-duplicates.mjs
          node scripts/validate-sitemap.mjs
          node scripts/sync-manifest.mjs --dry-run
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          git add data/article-manifest.jsonl data/progress.json sitemap.xml sitemaps data/sitemap-shards.json
          if git diff --cached --quiet; then
            echo "reconcile: derived state sync sau derive (khong con diff)."
            exit 0
          fi
          git commit -m "coordinator(reconcile): dong bo derived state voi repository truth (self-heal)"
          git push origin HEAD:main
          echo "reconcile: main da duoc sua derived state — dong bo derived tren staging (FF, khong force)."
          git fetch origin '+refs/heads/staging/*:refs/remotes/origin/staging/*' --quiet
          for K in 1 2 3; do
            B="staging/writer-$K"
            if git rev-parse --verify -q "refs/remotes/origin/$B" >/dev/null 2>&1; then
              git checkout -q -B "$B" "origin/$B"
              git checkout -q origin/main -- data/article-manifest.jsonl data/progress.json sitemap.xml sitemaps data/sitemap-shards.json
              git add data/article-manifest.jsonl data/progress.json sitemap.xml sitemaps data/sitemap-shards.json
              if ! git diff --cached --quiet; then
                git commit -q -m "coordinator(reconcile): sync derived state tren $B (staging chi khac main trong _posts)"
                git push origin "HEAD:refs/heads/$B" || echo "::warning::khong sync duoc $B (writer dang push?) — chu ky sau xu ly."
              fi
              git checkout -q -B main origin/main
            fi
          done
          echo "reconcile: derived state synced (main + staging)."

      - name: Production stop check (2 coordinator failures = STOP)
        run: |
          set -eu
          node scripts/cycle-phase.mjs --check-stop
      - name: Cycle resume plan (khong tao cycle moi khi con cycle recoverable)
        run: |
          set -eu
          node scripts/cycle-phase.mjs --resume

      # ---- 1. cho du output cac writer cua cycle, roi snapshot --------------
      - name: Collect staging snapshot (wait for cycle writers, read-only)
        id: collect
        run: |
          set -eu
          EXPECT=$(node -e '
            const fs = require("fs");
            let expected = "";
            try {
              const cyc = JSON.parse(fs.readFileSync("data/factory-cycle.json", "utf8"));
              if (!["idle","complete","failed"].includes(cyc.phase)) {
                expected = Object.entries(cyc.assignments || {})
                  .filter(([,ids]) => Array.isArray(ids) && ids.length > 0)
                  .map(([w]) => w).join(",");
              }
            } catch (e) {}
            console.log(expected);
          ')
          if [ -n "$EXPECT" ]; then
            node scripts/collect-staging.mjs --wait-for "$EXPECT"
          else
            node scripts/collect-staging.mjs
          fi

      # ---- 2. guard ---------------------------------------------------------
      - name: Guard (validate scope + cycle origin truoc khi cham main)
        id: guard
        run: node scripts/integrate-guard.mjs

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Cache dependencies (vendor/bundle)
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-prod-${{ runner.os }}-${{ hashFiles('Gemfile') }}
          restore-keys: |
            bundle-prod-${{ runner.os }}-
      - name: Bundle install
        if: steps.guard.outputs.noop != 'true'
        run: |
          set -eu
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      # ---- 3. MÔT publication transaction ----------------------------------
      - name: Publish transaction (posts + derived + cycle state, MÔT commit)
        if: steps.guard.outputs.noop != 'true'
        env:
          ADDED: ${{ steps.guard.outputs.added }}
          REPAIRED: ${{ steps.guard.outputs.repaired }}
        run: |
          set -eu
          git checkout -B main
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          node scripts/cycle-phase.mjs integrating
          node scripts/apply-staging.mjs
          node scripts/publish-loop.mjs --integrate --added "$ADDED" --repaired "$REPAIRED"
          MAIN_SHA=$(git rev-parse HEAD)
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          node scripts/cycle-phase.mjs --publishing --publication-sha "$MAIN_SHA"
          git add data/factory-cycle.json data/writer-checkpoint.json data/coordinator-state.json
          git commit -m "cycle(publishing): coordinator da push $MAIN_SHA — deploy Pages" || true
          git push origin HEAD:main
        id: publish

      # ---- 4. MÔT Pages deployment (legacy branch mode — trigger pages build API) ----
      # Repo Pages dang "Deploy from a branch" (co "pages build and deployment"
      # chay tu dong tren moi push main) — deploy-pages action chi hoat dong voi
      # Actions mode. Trigger build ngay bang POST /pages/builds (GITHUB_TOKEN).
      - name: Deploy Pages (legacy mode — POST /pages/builds)
        if: steps.guard.outputs.noop != 'true'
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          INFO=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/codeappweb/lab/pages)
          BUILD_TYPE=$(echo "$INFO" | grep -o '"build_type":"[^"]*"' | cut -d'"' -f4 || true)
          echo "pages build_type=$BUILD_TYPE"
          if [ "$BUILD_TYPE" = "workflow" ]; then
            echo "::error::Pages da o Actions mode — khoi phuc configure-pages/upload-pages-artifact/deploy-pages trong workflow nay."
            exit 1
          fi
          CODE=$(curl -s -o /tmp/pages-build.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/codeappweb/lab/pages/builds)
          echo "pages build trigger HTTP $CODE"
          cat /tmp/pages-build.json || true
          if [ "$CODE" != "201" ]; then
            echo "::error::khong trigger duoc pages build (legacy mode) — kiem tra GITHUB_TOKEN/pages:write permission."
            exit 1
          fi
          echo "url=https://codeappweb.github.io/lab" >> "$GITHUB_OUTPUT"
      - name: Verify live URL (that, khong gia dinh)
        if: steps.guard.outputs.noop != 'true'
        run: |
          set -eu
          SLUG=$(echo "${{ steps.guard.outputs.added }}" | cut -d, -f1 | sed 's|^_posts/[0-9-]*||; s|\.md$||')
          if [ -z "$SLUG" ]; then echo "khong co bai moi — skip live verify"; exit 0; fi
          URL="${{ steps.deployment.outputs.url }}/${SLUG}/"
          echo "verify: $URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then echo "live OK: $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::URL chua live sau deploy: $URL (HTTP $CODE)"
          exit 1

      # ---- 5. finalize cycle (bookkeeping, khong phai publication) ---------
      - name: Finalize cycle (complete + deployment id + live_verified)
        if: steps.guard.outputs.noop != 'true'
        run: |
          set -eu
          git checkout main
          git pull --ff-only origin main
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          node scripts/cycle-phase.mjs --complete --publication-sha "${{ steps.publish.outputs.main_sha }}" --deployment-id "${{ steps.deployment.outputs.id }}" --live-verified --run-id "${{ github.run_id }}"
          git add data/factory-cycle.json data/writer-checkpoint.json data/coordinator-state.json
          git commit -m "cycle(complete): ${{ steps.publish.outputs.main_sha }} — Pages deployment OK, live verified" || true
          git push origin HEAD:main

      # ---- 6. reset staging (force-with-lease = sha da snapshot) -----------
      - name: Reset staging branches (force-with-lease = sha da snapshot)
        if: steps.guard.outputs.noop != 'true' && success()
        run: sh /tmp/reset-staging.sh

      - name: Noop (khong co bai moi tren staging)
        if: steps.guard.outputs.noop == 'true'
        run: |
          echo "coordinator: staging rong — khong commit, khong deploy, exit 0 (idempotent)."

      # ---- 7. failure ledger: 2 run fail lien tiep = STOP production -------
      - name: Record failure (increment ledger, cycle -> failed)
        if: failure()
        run: |
          set -eu
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          git fetch origin main --quiet || true
          git pull --ff-only origin main || true
          # apply-staging da stage bai vao index (git checkout sha -- file) — transaction fail KHONG duoc commit index do
          git reset --hard origin/main
          node scripts/cycle-phase.mjs --fail-run --run-id "${{ github.run_id }}" || true
          git add data/factory-cycle.json data/coordinator-state.json data/writer-checkpoint.json || true
          git commit -m "coordinator(fail): run ${{ github.run_id }} that bai — ghi failure ledger (staging GIU NGUYEN)" || true
          git push origin HEAD:main || echo "::warning::khong push duoc failure ledger (co the do conflict) — ledger se duoc cap nhat o run sau."

  # ---- maintenance dispatch: sync derived state (repair manifest drift) ----
  # Cong cu thu cong DU PHONG — KHONG con bat buoc: coordinator self-heal
  # (buoc 0b) tu dong reconcile derived state o moi run.
  maintenance:
    name: Maintenance (sync derived state; no publish, no deploy)
    if: ${{ inputs.maintenance == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Cache dependencies (vendor/bundle)
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-prod-${{ runner.os }}-${{ hashFiles('Gemfile') }}
          restore-keys: |
            bundle-prod-${{ runner.os }}-
      - name: Bundle install
        run: |
          set -eu
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Maintenance transaction (derived allowlist only, MÔT commit, KHÔNG deploy)
        run: |
          set -eu
          git config user.name 'lab-factory'
          git config user.email 'codeappweb@users.noreply.github.com'
          node scripts/publish-loop.mjs --integrate --added "" --repaired ""
      - name: Report
        run: |
          echo "maintenance: derived state synced (manifest planned->published, progress, sitemap) — KHONG deploy Pages."
