name: Publish check (micro loop)

# CHECK-ONLY publish verification for the MICRO CONTINUOUS LOOP.
# The external WRITER (Mistral session) runs scripts/prepare-article.mjs
# and commits the article + derived allowlist + checkpoint in ONE commit
# BEFORE opening the PR. This workflow NEVER commits or pushes anything:
#   - derives the publish scope from the FULL commit range of the PR
#   - refuses out-of-scope files
#   - re-derives repository truth, re-runs the light gates, then REQUIRES a
#     clean tree (publish-loop --check): proves the writer committed the
#     derived state; no bot commits, no checkpoint push to trigger CI.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: publish-check-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  publish-check:
    if: startsWith(github.head_ref, 'article/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Derive publish scope from the full PR commit range
        id: scope
        run: |
          set -eu
          git fetch origin main
          git diff --name-status --no-renames origin/main...HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          OTHER=$(grep -v -E '^[AMD][[:space:]](_posts/|data/article-manifest\.jsonl|data/progress\.json|data/sitemap-shards\.json|sitemap\.xml|sitemaps/|data/writer-checkpoint\.json)' /tmp/changed.txt || true)
          if [ -n "$OTHER" ]; then
            echo "::error::out-of-scope changes in PR (only _posts/** + derived allowlist allowed):"
            echo "$OTHER"
            exit 1
          fi
          ADDED=$(grep -E '^A[[:space:]]_posts/' /tmp/changed.txt | cut -f2 | paste -sd, - || true)
          if [ -z "$ADDED" ]; then
            echo "::error::no added article file under _posts/ — an article PR must add its post file"
            exit 1
          fi
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "publish scope: added=[$ADDED]"
      - name: Publish check (re-derive → gates → tree must be clean, never commits)
        run: |
          set +e
          node scripts/publish-loop.mjs --added="${{ steps.scope.outputs.added }}" --check 2>&1 | tee /tmp/publish-check.log
          code=${PIPESTATUS[0]}
          tail -n 120 /tmp/publish-check.log > /tmp/publish-tail.txt
          exit $code
      - name: Upload diagnostics on failure (never commit them)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: publish-diagnostics-${{ github.event.pull_request.number }}
          path: |
            /tmp/changed.txt
            /tmp/publish-check.log
            /tmp/publish-tail.txt
          if-no-files-found: ignore