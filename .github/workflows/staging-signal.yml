name: Staging signal (writer output marker)

# SIGNAL WORKFLOW (NHE): writer push _posts/** len staging/writer-K chi TAO MỘT
# run marker HOAN TAT. KHONG chay coordinator trong context staging, KHONG deploy,
# KHONG cham main. production.yml (coordinator) trigger workflow_run tren run
# cua workflow nay — theo dinh nghia GitHub, workflow_run LUON chay tren
# DEFAULT BRANCH (main): main context + environment github-pages an toan,
# khong can dispatch API, khong phu thuoc token hay auth cua gh CLI.
# Paths filter: chi thay doi _posts/** moi signal — push dong bo engine/docs/
# data len staging KHONG tao fake publication cycle (coordinator xu ly noop
# idempotent neu van duoc goi).

on:
  push:
    branches: ['staging/writer-1', 'staging/writer-2', 'staging/writer-3']
    paths: ['_posts/**']

concurrency:
  group: staging-signal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signal:
    name: Writer pushed _posts (marker for workflow_run coordinator)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Record signal
        run: |
          set -eu
          echo "signal: _posts pushed to ${{ github.ref_name }} by ${{ github.actor }}."
          echo "signal: coordinator (production.yml) se duoc trigger qua workflow_run trong MAIN context khi run nay hoan tat."
