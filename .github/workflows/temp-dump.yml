name: temp-dump

on:
  workflow_dispatch:
  push:
    branches: [repair/engine-v2]
    paths: ['.github/workflows/temp-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dump text files as base64 PR comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post() {
            for i in 1 2 3; do
              if gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file "$1"; then return 0; fi
              echo "post attempt $i failed; retrying"
              sleep 10
            done
            echo "posting failed for $1"
            return 1
          }
          files=$(git ls-files | grep -E '\.(mjs|js|css|yml|yaml|json|html|md|txt|gemspec|svg|csv)$|^Gemfile$|^Rakefile$|^CNAME$|^LICENSE$|^\.gitattributes$|^\.gitignore$' | sort)
          part=0
          total=0
          for f in $files; do
            b=$(base64 -w0 "$f")
            sha=$(printf '%s' "$b" | sha256sum | cut -c1-12)
            n=$(( (${#b} + 49999) / 50000 ))
            for i in $(seq 1 $n); do
              s=$(( (i-1)*50000 ))
              e=$(( i*50000 ))
              chunk=$(printf '%s' "$b" | cut -c $((s+1))-$e)
              part=$((part+1))
              printf '===CHUNK %s %s %s %s %s\n~~~\n%s\n' "$f" "$i" "$n" "$sha" "$s" "$chunk" > /tmp/c.txt
              post /tmp/c.txt
            done
            total=$((total+1))
          done
          { printf '===DUMPDONE files=%s comments=%s head=%s\n' "$total" "$part" "$GITHUB_SHA"; } > /tmp/d.txt
          post /tmp/d.txt
