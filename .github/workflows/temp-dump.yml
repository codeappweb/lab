name: Temp dump (byte-exact file sync; DELETE BEFORE MERGE)

# Temporary cross-session byte-exact content channel (base64 in PR comments).
# The GitHub API + raw fetches in some agent environments corrupt long lines;
# base64 through PR comments preserves bytes exactly. Safe to delete any time.
on:
  push:
    branches: [repair/engine-v2]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dump:
    name: Dump files for offline session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle and post base64 parts to PR #1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES="scripts/validate-navigation.mjs scripts/tests/nav-regression.test.mjs scripts/tests/browser-qa.mjs scripts/tests/article-runtime.test.mjs scripts/lib/nav-data.mjs assets/js/article.js assets/js/main.js data/taxonomy.yml data/actions.yml scripts/engine/state.mjs scripts/gen-archive-pages.mjs"
          for f in _includes/*.html _layouts/*.html; do FILES="$FILES $f"; done
          B=/tmp/bundle.bin
          : > "$B"
          for f in $FILES; do
            if [ -f "$f" ]; then
              printf '===FILE:%s===' "\n$f" >> "$B"
              cat "$f" >> "$B"
              printf '\n===END===' >> "$B"
            fi
          done
          base64 -w 0 "$B" > /tmp/b64.txt
          SIZE=$(stat -c%s /tmp/b64.txt)
          SHA=$(sha256sum "$B" | cut -d' ' -f1)
          N=$(( (SIZE + 19000 - 1) / 19000 ))
          {
            echo "### TEMPFILEDUMP3 manifest (bundle ${SIZE} b64 chars, sha256 ${SHA}, ${N} parts; safe to delete)"
            echo '~~~'
            echo "files: $FILES"
            echo '~~~'
          } > /tmp/c0.md
          gh pr comment 1 --body-file /tmp/c0.md
          split -dl 19000 /tmp/b64.txt /tmp/part-
          i=0
          for p in /tmp/part-*; do
            i=$((i+1))
            {
              echo "### TEMPFILEDUMP3 part ${i} of ${N} (temporary base64 dump; safe to delete)"
              echo '~~~'
              cat "$p"
              echo ''
              echo '~~~'
            } > /tmp/c.md
            gh pr comment 1 --body-file /tmp/c.md
          done
