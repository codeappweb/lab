name: tmp-jekyll-diag
on:
  push:
    paths:
      - '.github/workflows/tmp-jekyll-diag.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: none
      - name: install jekyll
        run: gem install jekyll jekyll-feed jekyll-sitemap --no-document
      - name: build
        run: |
          set +e
          export BUNDLE_GEMFILE=/dev/null
          {
            git rev-parse HEAD
            echo '=== jekyll build ==='
            jekyll build --destination /tmp/site 2>&1
            echo "JEKYLL_EXIT=$?"
            echo '=== url count ==='
            if [ -f /tmp/site/sitemap.xml ]; then grep -c '<loc>' /tmp/site/sitemap.xml; else echo no-sitemap; fi
          } > DIAG-V9.txt 2>&1
          cat DIAG-V9.txt
      - name: commit results
        run: |
          git config user.name "diag-bot"
          git config user.email "actions@github.com"
          git add DIAG-V9.txt
          git commit -m "tmp: diag v9 results" || echo "nothing to commit"
          git push
