name: tmp-jekyll-diag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-jekyll-diag.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jekyll build
        run: |
          export GEM_HOME="$HOME/.gems"
          export PATH="$GEM_HOME/bin:$PATH"
          {
            echo '=== ruby ==='
            ruby -v
            echo '=== gem install ==='
            gem install jekyll jekyll-sitemap jekyll-feed --no-document 2>&1
            echo '=== jekyll version ==='
            jekyll -v 2>&1
            echo '=== jekyll build ==='
            jekyll build --trace -d /tmp/site 2>&1
            echo "JEKYLL_EXIT=$?"
          } > _tmpchunks/BUILD.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _tmpchunks
          git commit -m "tmp: jekyll diag v2 results"
          git push
