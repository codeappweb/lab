name: tmp-jekyll-diag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-jekyll-diag.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: diag
        run: |
          export GEM_HOME="$HOME/.gems"
          export PATH="$GEM_HOME/bin:$PATH"
          {
            echo '=== entities.json ground truth ==='
            git log -1 --format='%H %s'
            wc -c data/entities.json
            sha256sum data/entities.json
            echo '--- lines 560-580 ---'
            sed -n '560,580p' data/entities.json
            echo '--- control chars? ---'
            grep -cP '[\x00-\x08\x0b\x0c\x0e-\x1f]' data/entities.json || echo none
            echo '=== jekyll build ==='
            if [ -f Gemfile ]; then mv Gemfile Gemfile.diagbak; fi
            if [ -f Gemfile.lock ]; then mv Gemfile.lock Gemfile.lock.diagbak; fi
            gem install jekyll jekyll-sitemap jekyll-feed --no-document > /dev/null 2>&1
            jekyll build --trace -d /tmp/site 2>&1 | head -60
            echo "JEKYLL_EXIT=$?"
            if [ -f /tmp/site/index.html ]; then echo SITE_OK; fi
            echo '=== generated url count ==='
            grep -c '<loc>' /tmp/site/sitemap.xml 2>/dev/null || echo no-sitemap
          } > BUILD-DIAG.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main 2>/dev/null || true
            git add BUILD-DIAG.txt
            git commit -m "tmp: jekyll diag v6 results (ground truth entities)" 2>/dev/null || true
            if git push; then exit 0; fi
            sleep 10
          done
          exit 1
