name: tmp-jekyll-diag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-jekyll-diag.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: diag
        run: |
          {
            echo '=== ground truth ==='
            git rev-parse HEAD
            wc -c data/entities.json
            sha256sum data/entities.json
            echo '--- sed 560,580 ---'
            sed -n '560,580p' data/entities.json
            echo '--- od around offset 14800 ---'
            tail -c 400 data/entities.json | od -c | head -30
          } > ENTITIES-TRUTH.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main 2>/dev/null || true
          git add ENTITIES-TRUTH.txt
          git commit -m "tmp: entities truth v7" 2>/dev/null || true
          git push
