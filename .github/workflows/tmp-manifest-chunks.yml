name: tmp-manifest-chunks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-manifest-chunks.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chunks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: inspect tail
        run: |
          mkdir -p _tmpchunks
          tail -c 300 data/article-manifest.jsonl | base64 -w0 > _tmpchunks/TAIL-B64.txt
          awk '{print NR ": " length($0)}' data/article-manifest.jsonl > _tmpchunks/LINELEN.txt
          sed -n '70,89p' data/article-manifest.jsonl | cut -c1-120 > _tmpchunks/LINES70-89.txt
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _tmpchunks
          git commit -m "tmp: manifest tail inspection"
          git push
