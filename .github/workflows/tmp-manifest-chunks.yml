name: tmp-manifest-chunks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-manifest-chunks.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chunks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: split manifest
        run: |
          mkdir -p _tmpchunks
          split -b 12000 -d -a 2 data/article-manifest.jsonl _tmpchunks/m
          { sha1sum data/article-manifest.jsonl; wc -c data/article-manifest.jsonl; wc -l data/article-manifest.jsonl; } > _tmpchunks/INFO.txt
      - name: commit chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmpchunks
          git commit -m "tmp: manifest chunks for tooling readback (will be removed)"
          git push
