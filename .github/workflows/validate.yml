name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    name: Script selftest (fixtures must pass AND fail correctly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse-check every executable script
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs scripts/engine/*.mjs; do
            node --check "$f"
          done
      - name: Selftest (ok fixture passes, bad fixture fails)
        run: node scripts/selftest.mjs

  validate:
    name: Content + sitemap + build gates
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconcile manifest with actual posts (derive state in CI)
        run: bash scripts/ci-run.sh node scripts/sync-manifest.mjs
      - name: Derive site data
        run: |
          bash scripts/ci-run.sh node scripts/gen-site-data.mjs
          bash scripts/ci-run.sh node scripts/gen-archive-pages.mjs
          echo "::warning title=dbg-src::$(ls danh-muc/sua-chua/ 2>/dev/null | tr '\n' ' ')"
      - name: Validate content quality
        run: bash scripts/ci-run.sh node scripts/validate-content-quality.mjs
      - name: Detect duplicates
        run: bash scripts/ci-run.sh node scripts/detect-duplicates.mjs
      - name: Check internal links
        run: bash scripts/ci-run.sh node scripts/check-links.mjs
      - name: Regenerate sitemap shards
        run: bash scripts/ci-run.sh node scripts/gen-sitemap-shards.mjs
      - name: Validate sitemap
        run: bash scripts/ci-run.sh node scripts/validate-sitemap.mjs
      - name: Self-heal audit
        run: bash scripts/ci-run.sh node scripts/self-heal-audit.mjs
      - name: Legal freshness audit (gate mode)
        run: bash scripts/ci-run.sh node s
cripts/legal-freshness-audit.mjs --gate
      - name: SEO scoring
        run: bash scripts/ci-run.sh node scripts/seo-score.mjs
      - name: Compute content hashes
        run: bash scripts/ci-run.sh node scripts/compute-content-hashes.mjs
      - name: Manifest sync idempotency (dry-run must be a no-op)
        run: bash scripts/ci-run.sh node scripts/sync-manifest.mjs --dry-run
      - name: Engine status and preflight (never generates, never publishes)
        run: |
          bash scripts/ci-run.sh node scripts/engine/runner.mjs status
          bash scripts/ci-run.sh node scripts/engine/runner.mjs preflight
      - name: Measure output capacity (source estimate)
        run: bash scripts/ci-run.sh node scripts/measure-output.mjs

      # Real Jekyll build with the github-pages gem. No || true: a build
      # failure fails this job and blocks the pipeline.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build site (must succeed)
        run: |
          bundle install --jobs 4
          bundle exec jekyll build
      - name: Debug listing
        run: echo "::warning title=dbg-site::$(ls _site/danh-muc/sua-chua/ 2>/dev/null | tr '\n' ' ')"; echo "::warning title=dbg-src2::$(ls danh-muc/sua-chua/ | tr '\n' ' ')"
      - name: Measure built output
        run: bash scripts/ci-run.sh node scripts/measure-output.mjs
      - name: Validate built output (rendered links + sitemap membership)
        run: bash scripts/ci-run.sh node scripts/validate-built.mjs --site _site

      - name: Upload reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/
          if-no-files-found: warn
