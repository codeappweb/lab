name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # failure diagnostics comment only

jobs:
  selftest:
    name: Script + engine selftest (fixtures must pass AND fail correctly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse-check every executable script
        run: |
          fail=0
          for f in scripts/*.mjs scripts/lib/*.mjs scripts/engine/*.mjs; do
            if ! node --check "$f" 2>/tmp/parse.err; then
              echo "::error::Syntax check FAILED for $f"
              sed -E 's|^|::error::|' /tmp/parse.err | head -n 12
              fail=1
            fi
          done
          exit $fail
      - name: Selftest (ok fixture passes, bad fixture fails)
        run: node scripts/selftest.mjs
      - name: "Engine selftest (offline orchestration: state, locks, retries, blocking)"
        run: |
          set -o pipefail
          if ! node scripts/engine-selftest.mjs --verbose 2>&1 | tee /tmp/eng.log; then
            grep -E 'BAD|engine-selftest:' /tmp/eng.log | head -n 15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

  manifest-reconcile:
    name: Manifest reconcile (sync published posts; generates nothing)
    runs-on: ubuntu-latest
    # This job performs the documented maintenance operation
    # `node scripts/sync-manifest.mjs` (docs/ENGINE-RUNBOOK.md): it reconciles
    # ALREADY-PUBLISHED posts into data/article-manifest.jsonl and derives
    # data/progress.json. It does NOT generate, draft, validate or publish any
    # article. It is idempotent: when posts and manifest already agree, it
    # changes nothing and pushes nothing.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconcile manifest with published posts (conflicts fail loudly)
        run: node scripts/sync-manifest.mjs
      - name: Commit reconciled data (skip when already in sync)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "manifest in sync — nothing to commit"
          else
            git add data/
            git commit -m "data: reconcile manifest + progress with published posts (scripts/sync-manifest.mjs)"
            git push
            echo "reconciled; the push triggers a fresh validation run on the reconciled state"
          fi

  validate:
    name: Content + sitemap + build gates
    runs-on: ubuntu-latest
    needs: [selftest, manifest-reconcile]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Derive site data
        run: |
          node scripts/gen-site-data.mjs
          node scripts/gen-archive-pages.mjs
      - name: Validate content quality
        run: node scripts/validate-content-quality.mjs
      - name: Detect duplicates
        run: node scripts/detect-duplicates.mjs
      - name: Check internal links
        run: node scripts/check-links.mjs
      - name: Regenerate sitemap shards
        run: node scripts/gen-sitemap-shards.mjs
      - name: Validate sitemap
        run: node scripts/validate-sitemap.mjs
      - name: Self-heal audit
        run: node scripts/self-heal-audit.mjs
      - name: Legal freshness audit (gate mode)
        run: node scripts/legal-freshness-audit.mjs --gate
      - name: SEO scoring
        run: node scripts/seo-score.mjs
      - name: Compute content hashes
        run: node scripts/compute-content-hashes.mjs
      - name: Manifest sync (dry-run; conflicts are failures)
        run: node scripts/sync-manifest.mjs --dry-run
      - name: Engine preflight (never generates, never publishes)
        run: |
          node scripts/engine/runner.mjs status
          node scripts/engine/runner.mjs preflight
      - name: Measure output capacity (source estimate)
        run: node scripts/measure-output.mjs

      # Real Jekyll build with the github-pages gem. No || true: a build
      # failure fails this job and blocks the pipeline.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build site (must succeed)
        run: |
          bundle install --jobs 4
          bundle exec jekyll build
      - name: Measure built output
        run: node scripts/measure-output.mjs
      - name: Validate built output (rendered links + sitemap membership)
        run: node scripts/validate-built.mjs --site _site

      - name: Post failure diagnostics to the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Validate failed — diagnostics from reports/"
            echo '```'
            for f in reports/link-errors.json reports/validation-errors.json reports/content-quality.json reports/seo-scores.json reports/capacity.json; do
              if [ -f "$f" ]; then echo "--- $f ---"; head -c 4000 "$f"; echo; fi
            done
            echo '```'
            echo "(Full logs: check-run page. Gates are never weakened to pass CI.)"
          } > /tmp/pr-body.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-body.md || true

      - name: Upload reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/
          if-no-files-found: warn
