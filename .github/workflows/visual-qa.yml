name: Visual QA (browser)

# Real browser verification of the REPAIR BRANCH build (not production):
# a Jekyll build of this revision served locally, driven by Playwright's
# real Chromium. Automated checks + screenshots (uploaded as artifacts for
# human inspection). Passing this job is REAL browser testing; it does NOT
# replace human visual inspection of the screenshots.
on:
  pull_request:
  push:
    branches: [repair/engine-v2]

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # failure diagnostics comment only

jobs:
  browser-qa:
    name: Playwright browser QA (Chromium; mobile/tablet/desktop; light+dark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build the repair branch (real Jekyll build)
        run: |
          set -o pipefail
          node scripts/gen-site-data.mjs 2>&1 | tee /tmp/build.log
          node scripts/gen-archive-pages.mjs 2>&1 | tee -a /tmp/build.log
          bundle install --jobs 4 2>&1 | tee -a /tmp/build.log
          bundle exec jekyll build 2>&1 | tee -a /tmp/build.log
      - name: Install pinned Playwright + Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run browser QA (screenshots -> screenshots/)
        run: node scripts/tests/browser-qa.mjs
        env:
          SITE_DIR: _site
      - name: Upload screenshots (for HUMAN visual inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: screenshots/
          if-no-files-found: warn
      - name: Post failure diagnostics to the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Visual QA failed — diagnostics"
            echo '```'
            gh run view "$GITHUB_RUN_ID" --log-failed 2>&1 | tail -n 150 || true
            echo '```'
            echo '--- build log (tail 60, when the build step failed) ---'
            echo '```'
            tail -n 60 /tmp/build.log 2>/dev/null || echo '(build log missing)'
            echo '```'
            echo "(Full logs: check-run page. Gates are never weakened to pass CI.)"
          } > /tmp/pr-body.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-body.md || true
