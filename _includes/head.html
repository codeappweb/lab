<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title | smartify }} — {{ site.title | default: "Xe &amp; Di Chuyển" }}{% else %}{{ site.title | default: "Xe &amp; Di Chuyển" }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | default: 'Hệ sinh thái nội dung về xe máy, xe điện, xe đạp, sửa chữa, pháp lý và du lịch bằng xe tại Hà Nội.' | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title | default: 'Xe &amp; Di Chuyển' }}">
<meta property="og:title" content="{{ page.title | default: site.title | default: 'Xe &amp; Di Chuyển' }}">
<meta property="og:description" content="{{ page.description | default: '' | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/app2.css' | relative_url }}">
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<link rel="alternate" type="application/rss+xml" title="RSS" href="{{ '/feed.xml' | relative_url }}">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('xdc-theme'); } catch (e) {}
    if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    document.documentElement.setAttribute('data-theme', t || 'light');
  })();
</script>
