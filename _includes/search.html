<div class="overlay" id="searchOverlay" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Tìm kiếm">
    <div class="palette__row">
      {% include icon.html name="search" %}
      <input type="search" id="searchInput" placeholder="Tìm bài viết, chủ đề…" autocomplete="off" spellcheck="false" aria-label="Từ khóa tìm kiếm">
      <kbd class="kbd">Esc</kbd>
    </div>
    <div class="palette__results" id="searchResults"></div>
    <div class="palette__hint">
      <span><kbd class="kbd">↑↓</kbd> di chuyển</span>
      <span><kbd class="kbd">Enter</kbd> mở</span>
      <span><kbd class="kbd">Esc</kbd> đóng</span>
    </div>
  </div>
</div>
