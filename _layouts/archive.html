---
layout: default
---
<section class="hub-hero">
  <div class="container">
    <p class="eyebrow">Lưu trữ</p>
    <div class="hub-hero__row">
      <div>
        <h1>{{ page.title | escape }}</h1>
        <p class="hub-hero__desc">{{ page.description | escape }}</p>
      </div>
    </div>
  </div>
</section>
<div class="container">
  <nav class="crumbs" aria-label="Điều hướng breadcrumb">
    <a href="{{ '/' | relative_url }}">Trang chủ</a>
    <a href="{{ '/danh-muc/' | relative_url }}">Danh mục</a>
    <a href="{{ '/danh-muc/' | append: page.parent | append: '/' | relative_url }}">{{ page.parent }}</a>
    <span aria-current="page">Trang {{ page.page_num }}</span>
  </nav>
  <div class="prose cat-prose archive-page">
    {{ content }}
  </div>
</div>
