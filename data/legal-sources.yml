# Nguồn pháp lý đã kiểm chứng — mọi con số pháp lý trên site phải có mục ở đây.
# Quy tắc: KHÔNG ghi "đã kiểm chứng" nếu chưa ghi rõ nguồn và ngày kiểm tra.
sources:
  - id: "nd168-helmet-fine"
    source_title: "Nghị định 168/2024/NĐ-CP — Quy định xử phạt vi phạm hành chính trong lĩnh vực giao thông đường bộ"
    source_url: "https://vanban.chinhphu.vn/nghi-dinh-168-2024-nd-cp-559701.html"
    publisher: "Chính phủ (Văn bản hợp nhất trên Cổng thông tin điện tử Chính phủ)"
    published_or_effective_date: "2024-12-26"
    fact: "Mức phạt người điều khiển xe máy không đội mũ bảo hiểm: 400.000–600.000 đồng (Điều 7, khoản 2)"
    last_verified: "2026-09-25"
    applies_to: "danh-muc/phap-ly.md, danh-muc/phap-ly/muc-phat/"
  - id: "nd238-amendment"
    source_title: "Nghị định 238/2026/NĐ-CP — Sửa đổi, bổ sung một số điều khoản của Nghị định 168/2024/NĐ-CP"
    source_url: "https://vanban.chinhphu.vn/"
    publisher: "Chính phủ"
    published_or_effective_date: "2026-06-26 (ban hành), 2026-08-15 (hiệu lực)"
    fact: "Sửa đổi, bổ sung Nghị định 168/2024/NĐ-CP; không tăng mức phạt tiền và không nâng mức trừ điểm giấy phép lái xe so với Nghị định 168"
    last_verified: "2026-09-25"
    applies_to: "danh-muc/phap-ly.md, danh-muc/phap-ly/muc-phat/"
  - id: "luat36-xe-gan-may-50cc"
    source_title: "Luật số 36/2024/QH15 về trật tự, an toàn giao thông đường bộ"
    source_url: "https://vanban.chinhphu.vn/?pageid=27160&docid=211194"
    publisher: "Quốc hội (văn bản hợp nhất trên Cổng thông tin điện tử Chính phủ)"
    published_or_effective_date: "2024-11-26 (ban hành), 2025-01-01 (hiệu lực)"
    fact: "Xe gắn máy có dung tích xi-lanh từ 50 cm³ trở xuống: người đủ 16 tuổi được điều khiển, không cần GPLX (Điều 34); độ tuổi điều khiển xe gắn máy trên 50 cm³: 16 tuổi với xe gắn máy, 18 tuổi với xe mô tô (Điều 59)"
    last_verified: "2026-09-29"
    applies_to: "thue-xe-50cc-o-ha-noi-cho-nguoi-chua-co-bang-lai"
  - id: "vie-1968-idp-quoc-te"
    source_title: "Công ước Vienna 1968 về giao thông đường bộ — Giấy phép lái xe quốc tế (IDP)"
    source_url: "https://vanban.chinhphu.vn/?pageid=27160&docid=211194"
    publisher: "Liên Hợp Quốc (Việt Nam là thành viên; tham chiếu qua Cổng thông tin điện tử Chính phủ và Cục Đường bộ Việt Nam)"
    published_or_effective_date: "1968-11-08 (ký kết)"
    fact: "Người nước ngoài lái xe tại Việt Nam cần Giấy phép lái xe quốc tế (IDP) theo Công ước Vienna 1968, kèm bằng lái quốc gia và hộ chiếu; IDP được cấp qua Cổng Dịch vụ công Quốc gia"
    last_verified: "2026-09-29"
    applies_to: "thue-xe-may-o-ha-noi-cho-nguoi-nuoc-ngoai-bang-lai-va-giay-to"
verification_rules:
  - "Không đưa con số pháp lý lên site nếu chưa có mục nguồn tương ứng."
  - "Khi văn bản bị sửa đổi, cập nhật fact + last_verified hoặc gỡ con số."
  - "Ưu tiên nguồn: Công báo điện tử, Cổng thông tin điện tử Chính phủ, Bộ Công an."
