sources:
  - id: "nd168-helmet-fine"
    source_title: "Nghị định 168/2024/NĐ-CP — Quy định xử phạt vi phạm hành chính trong lĩnh vực giao thông đường bộ"
    source_url: "https://vanban.chinhphu.vn/nghi-dinh-168-2024-nd-cp-559701.html"
    publisher: "Chính phủ (Văn bản hợp nhất trên Cổng thông tin điện tử Chính phủ)"
    published_or_effective_date: "2024-12-26"
    fact: "Mức phạt người điều khiển xe máy không đội mũ bảo hiểm: 400.000–600.000 đồng (Điều 7, khoản 2)"
    last_verified: "2026-09-25"
    applies_to: "danh-muc/phap-ly.md, danh-muc/phap-ly/muc-phat/"
  - id: "nd238-amendment"
    source_title: "Nghị định 238/2026/NĐ-CP — Sửa đổi, bổ sung một số điều khoản của Nghị định 168/2024/NĐ-CP"
    source_url: "https://vanban.chinhphu.vn/"
    publisher: "Chính phủ"
    published_or_effective_date: "2026-06-26 (ban hành), 2026-08-15 (hiệu lực)"
    fact: "Sửa đổi, bổ sung Nghị định 168/2024/NĐ-CP; không tăng mức phạt tiền và không nâng mức trừ điểm giấy phép lái xe so với Nghị định 168"
    last_verified: "2026-09-25"
    applies_to: "danh-muc/phap-ly.md, danh-muc/phap-ly/muc-phat/"
  - id: "luat36-xe-gan-may-50cc"
    source_title: "Luật số 36/2024/QH15 về trật tự, an toàn giao thông đường bộ"
    source_url: "https://vanban.chinhphu.vn/?pageid=27160&docid=211194"
    publisher: "Quốc hội (văn bản hợp nhất trên Cổng thông tin điện tử Chính phủ)"
    published_or_effective_date: "2024-11-26 (ban hành), 2025-01-01 (hiệu lực)"
    fact: "Xe gắn máy có dung tích xi-lanh từ 50 cm³ trở xuống: người đủ 16 tuổi được điều khiển, không cần GPLX (Điều 34); độ tuổi điều khiển xe gắn máy trên 50 cm³: 16 tuổi với xe gắn máy, 18 tuổi với xe mô tô (Điều 59)"
    last_verified: "2026-09-29"
    applies_to: "thue-xe-50cc-o-ha-noi-cho-nguoi-chua-co-bang-lai"
  - id: "vie-1968-idp-quoc-te"
    source_title: "Công ước Vienna 1968 về giao thông đường bộ — Giấy phép lái xe quốc tế (IDP)"
    source_url: "https://dichvucong.gov.vn/p/home/dvc-chi-tiet-thu-tuc-hanh-chinh.html?ma_thu_tuc=2.001002"
    publisher: "Cổng Dịch vụ công Quốc gia (thủ tục 2.001002 — cấp Giấy phép lái xe quốc tế); quy định sử dụng: Thông tư 29/2015/TT-BGTVT (Bộ Giao thông vận tải, giới thiệu tại pbgdpl.gov.vn)"
    published_or_effective_date: "1968-11-08 (ký kết Công ước Vienna 1968); hiệu lực với Việt Nam từ 2014-08-20"
    fact: "Việt Nam tham gia Công ước Vienna 1968; người có IDP do nước thành viên Công ước cấp, khi điều khiển xe tại Việt Nam phải mang theo IDP kèm giấy phép lái xe quốc gia tương ứng còn hiệu lực (Thông tư 29/2015/TT-BGTVT, Điều 10–11); IDP do Cục Đường bộ Việt Nam hoặc Sở GTVT cấp qua thủ tục 2.001002"
    last_verified: "2026-09-29"
    applies_to: "thue-xe-may-o-ha-noi-cho-nguoi-nuoc-ngoai-bang-lai-va-giay-to"
  - id: "luat36-phan-loai-xe-dien"
    source_title: "Luật số 36/2024/QH15 về trật tự, an toàn giao thông đường bộ — Điều 34"
    source_url: "https://vanban.chinhphu.vn/?pageid=27160&docid=211194"
    publisher: "Quốc hội (văn bản hợp nhất trên Cổng thông tin điện tử Chính phủ)"
    published_or_effective_date: "2024-11-26 (ban hành), 2025-01-01 (hiệu lực)"
    fact: "Xe gắn máy: hai hoặc ba bánh chạy bằng động cơ, vận tốc thiết kế không lớn hơn 50 km/h; động cơ điện thì công suất không lớn hơn 4 kW; xe gắn máy không bao gồm xe đạp máy. Xe đạp máy (kể cả xe đạp điện): xe đạp có trợ lực từ động cơ, nguồn động lực tự ngắt khi người lái ngừng đạp hoặc khi xe đạt tới tốc độ 25 km/h"
    last_verified: "2026-10-01"
    applies_to: "xe-dien-toc-do-toi-da-va-gioi-han-phap-ly-khi-nao-can-bang-lai, xe-dap-dien-va-xe-may-dien-khac-biet-phap-ly-va-van-hanh"
  - id: "luat36-gplx-do-tuoi-xe-dien"
    source_title: "Luật số 36/2024/QH15 về trật tự, an toàn giao thông đường bộ — Điều 57, Điều 59"
    source_url: "https://vanban.chinhphu.vn/?pageid=27160&docid=211194"
    publisher: "Quốc hội (văn bản hợp nhất trên Cổng thông tin điện tử Chính phủ)"
    published_or_effective_date: "2024-11-26 (ban hành), 2025-01-01 (hiệu lực)"
    fact: "Người đủ 16 tuổi được điều khiển xe gắn máy (kể cả xe gắn máy điện không quá 4 kW), không cần GPLX; xe mô tô điện công suất trên 4 kW cần GPLX hạng A1 (đến 11 kW) hoặc hạng A (trên 11 kW), người điều khiển mô tô phải từ đủ 18 tuổi; xe đạp máy (xe đạp điện) là xe thô sơ, không yêu cầu GPLX, không cấp đăng ký và biển số"
    last_verified: "2026-10-01"
    applies_to: "xe-dien-toc-do-toi-da-va-gioi-han-phap-ly-khi-nao-can-bang-lai, xe-dap-dien-va-xe-may-dien-khac-biet-phap-ly-va-van-hanh"
  - id: "nd168-xe-dap-may-mu-bao-hiem"
    source_title: "Nghị định 168/2024/NĐ-CP — Điều 9, khoản 4, điểm d (xử phạt xe đạp máy, xe thô sơ)"
    source_url: "https://vanban.chinhphu.vn/nghi-dinh-168-2024-nd-cp-559701.html"
    publisher: "Chính phủ (Văn bản hợp nhất trên Cổng thông tin điện tử Chính phủ)"
    published_or_effective_date: "2024-12-26 (ban hành), 2025-01-01 (hiệu lực)"
    fact: "Người điều khiển xe đạp máy không đội mũ bảo hiểm cho người đi mô tô, xe máy hoặc đội nhưng không cài quai đúng quy cách: phạt 400.000–600.000 đồng; kèm quy định tại khoản 3 Điều 31 Luật 36/2024/QH15: người điều khiển, người được chở trên xe đạp máy phải đội mũ bảo hiểm đúng quy chuẩn và cài quai đúng quy cách"
    last_verified: "2026-10-01"
    applies_to: "di-xe-dap-di-lam-an-toan-do-bao-ho-va-luat-giao-thong, xe-dap-dien-va-xe-may-dien-khac-biet-phap-ly-va-van-hanh"
  - id: "nd168-xe-tho-so-dieu-kien-xe"
    source_title: "Nghị định 168/2024/NĐ-CP — Điều 9, Điều 15 (xe thô sơ: quy tắc và điều kiện phương tiện)"
    source_url: "https://vanban.chinhphu.vn/nghi-dinh-168-2024-nd-cp-559701.html"
    publisher: "Chính phủ (Văn bản hợp nhất trên Cổng thông tin điện tử Chính phủ)"
    published_or_effective_date: "2024-12-26 (ban hành), 2025-01-01 (hiệu lực)"
    fact: "Người điều khiển xe đạp, xe đạp máy, xe thô sơ khác đi ngược chiều hoặc vi phạm quy tắc giao thông đường bộ bị xử phạt theo Điều 9; điều khiển xe thô sơ không có hệ thống thắng xe (phanh) khi tham gia giao thông: phạt 300.000–400.000 đồng theo Điều 15"
    last_verified: "2026-10-01"
    applies_to: "di-xe-dap-di-lam-an-toan-do-bao-ho-va-luat-giao-thong"
verification_rules:
  - "Không đưa con số pháp lý lên site nếu chưa có mục nguồn tương ứng."
  - "Khi văn bản bị sửa đổi, cập nhật fact + last_verified hoặc gỡ con số."
  - "Ưu tiên nguồn: Công báo điện tử, Cổng thông tin điện tử Chính phủ, Bộ Công an."
